<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<base target="_top">
<title>LTSC Admin</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1C5CAB">
<link rel="apple-touch-icon" href="icon-192.png">

<style>
  body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    font-family: system-ui, -apple-system, BlinkMacSystemFont;
    background-color: #1C5CAB;
  }

  /* Splash Screen */
  #splash {
    position: fixed;
    inset: 0;
    background: linear-gradient(135deg, #1C5CAB, #0F3B7A);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #fff;
    z-index: 9999;
    transition: opacity .5s ease;
    pointer-events: none; /* ອະນຸຍາດໃຫ້ກົດທະລຸໄດ້ຖ້າມີບັນຫາ */
  }

  #logo {
    width: 72px;
    height: 72px;
    margin-bottom: 16px;
  }

  .spinner {
    width: 36px;
    height: 36px;
    border: 4px solid rgba(255,255,255,.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin-bottom: 12px;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .loading-text {
    font-size: 14px;
    opacity: .9;
  }

  /* ສະແດງ iframe ໄວ້ເລີຍ ເພື່ອໃຫ້ມັນ Render ໃນ Background */
  iframe {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    border: none;
    display: block;
  }
</style>
</head>

<body>

<!-- Splash -->
<div id="splash">
  <img id="logo" src="icon-192.png" alt="HR Connect">
  <div class="spinner"></div>
  <div class="loading-text">HR Connect...</div>
</div>

<!-- App: ເພີ່ມ permissions allow ແລະ sandbox ເພື່ອຮອງຮັບ Mobile Browser -->
<iframe
  id="app"
  src="https://script.google.com/macros/s/AKfycbzU2Wc4YkupNH7bHhliguKRNhn93uZap9T9IOSE3XwOmn1wPX5Q6HuCKlCnWY2QEfIo/exec"
  allow="fullscreen; geolocation; microphone; camera; clipboard-write;"
  sandbox="allow-forms allow-modals allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-scripts">
</iframe>

<script>
  const splash = document.getElementById('splash');
  const app = document.getElementById('app');

  function hideSplash() {
    if (splash.style.display !== 'none') {
      splash.style.opacity = 0;
      setTimeout(() => {
        splash.style.display = 'none';
      }, 500);
    }
  }

  // 1. ເມື່ອ iframe ໂຫຼດສຳເລັດ ໃຫ້ປິດ Splash Screen
  app.onload = () => {
    setTimeout(hideSplash, 400);
  };

  // 2. Fallback: ຖ້າເນັດມືຖືຊ້າ ຫຼື onload ບໍ່ທຳງານ ໃຫ້ບັງຄັບປິດ Splash ພາຍໃນ 6 ວິນາທີ
  setTimeout(hideSplash, 6000);
</script>

</body>
</html>
