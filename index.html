<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LTSC Admin</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1C5CAB">
<link rel="apple-touch-icon" href="icon-192.png">

<style>
  body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    font-family: system-ui, -apple-system, BlinkMacSystemFont;
    background-color: #1C5CAB;
  }

  /* Splash Screen */
  #splash {
    position: fixed;
    inset: 0;
    background: linear-gradient(135deg, #1C5CAB, #0F3B7A);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #fff;
    z-index: 9999;
    transition: opacity .4s ease, visibility .4s;
  }

  #logo {
    width: 72px;
    height: 72px;
    margin-bottom: 16px;
  }

  .spinner {
    width: 36px;
    height: 36px;
    border: 4px solid rgba(255,255,255,.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin-bottom: 12px;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .loading-text {
    font-size: 14px;
    opacity: .9;
  }

  /* Iframe: ຕັ້ງໃຫ້ຢູ່ດ້ານຫຼັງ Splash Screen ຕັ້ງແຕ່ທຳອິດ (ບໍ່ໃຊ້ display: none) */
  iframe {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    border: none;
  }
</style>
</head>

<body>

<!-- Splash Screen -->
<div id="splash">
  <img id="logo" src="icon-192.png" alt="HR Connect">
  <div class="spinner"></div>
  <div class="loading-text">HR Connect...</div>
</div>

<!-- App Iframe: ເພີ່ມ permissions ຕ່າງໆ ເພື່ອບໍ່ໃຫ້ບຣາວເຊີມືຖືບລັອກ -->
<iframe
  id="app"
  src="https://script.google.com/macros/s/AKfycbzU2Wc4YkupNH7bHhliguKRNhn93uZap9T9IOSE3XwOmn1wPX5Q6HuCKlCnWY2QEfIo/exec"
  allow="fullscreen; camera; microphone; geolocation"
  sandbox="allow-top-navigation allow-scripts allow-forms allow-same-origin allow-popups allow-modals">
</iframe>

<script>
  const splash = document.getElementById('splash');
  let isHidden = false;

  // ຟັງຊັນປິດ Splash Screen
  function hideSplash() {
    if (isHidden) return;
    isHidden = true;
    splash.style.opacity = '0';
    setTimeout(() => {
      splash.style.display = 'none';
    }, 400);
  }

  // 1. ຖ້າ iframe ໂຫຼດສຳເລັດປົກກະຕິ
  document.getElementById('app').addEventListener('load', () => {
    setTimeout(hideSplash, 500);
  });

  // 2. ຕົວປ້ອງກັນ (Fallback): ຖ້າເນັດມືຖືຊ້າ ຫຼື onload ບໍ່ທຳງານ 
  // ພາຍໃນ 4 ວິນາທີ ຈະບັງຄັບເປີດໜ້າຕ່າງຂຶ້ນມາທັນທີ ບໍ່ໃຫ້ຄ້າງໜ້າ Splash
  setTimeout(hideSplash, 4000);
</script>

</body>
</html>
