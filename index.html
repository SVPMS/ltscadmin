<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LTSC Admin</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1C5CAB">
<link rel="apple-touch-icon" href="icon-192.png">

<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #1C5CAB;
    font-family: system-ui, -apple-system, BlinkMacSystemFont;
  }

  /* Splash Screen */
  #splash {
    position: fixed;
    inset: 0;
    background: linear-gradient(135deg, #1C5CAB, #0F3B7A);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #fff;
    z-index: 9999;
    transition: opacity .4s ease;
  }

  #logo {
    width: 72px;
    height: 72px;
    margin-bottom: 16px;
  }

  .spinner {
    width: 36px;
    height: 36px;
    border: 4px solid rgba(255,255,255,.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin-bottom: 12px;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .loading-text {
    font-size: 14px;
    opacity: .9;
  }

  iframe {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border: none;
  }
</style>
</head>

<body>

<div id="splash">
  <img id="logo" src="icon-192.png" alt="HR Connect">
  <div class="spinner"></div>
  <div class="loading-text">HR Connect...</div>
</div>

<!-- ສັງເກດ: ບໍ່ມີຄຳວ່າ sandbox ແລ້ວ ເພື່ອໃຫ້ Google Script ເຮັດວຽກໄດ້ 100% -->
<iframe
  id="app"
  src="https://script.google.com/macros/s/AKfycbzU2Wc4YkupNH7bHhliguKRNhn93uZap9T9IOSE3XwOmn1wPX5Q6HuCKlCnWY2QEfIo/exec"
  allow="fullscreen; camera; microphone; geolocation; autoplay">
</iframe>

<script>
  const splash = document.getElementById('splash');
  const iframe = document.getElementById('app');

  function removeSplash() {
    if (splash.style.display !== 'none') {
      splash.style.opacity = '0';
      setTimeout(() => {
        splash.style.display = 'none';
      }, 400);
    }
  }

  // ເມື່ອໂຫຼດສຳເລັດ
  iframe.addEventListener('load', () => {
    setTimeout(removeSplash, 500);
  });

  // ກັນພາດ: ຖ້າເນັດມືຖືຊ້າ ຫຼື iframe ບໍ່ຍອມສົ່ງ event load, ພາຍໃນ 5 ວິນາທີ ໃຫ້ເປີດເລີຍ
  setTimeout(removeSplash, 5000);
</script>

</body>
</html>
